[project]
name = "django-subforms"
version = "0.4.1"
description = "Wrap django forms as fields and fields as dynamic arrays."
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "django",
    "sub",
    "form",
    "nested",
    "widget",
    "json",
    "array",
    "dynamic",
]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
]

[project.urls]
"Homepage" = "https://mrthearman.github.io/django-subforms"
"Repository" = "https://github.com/MrThearMan/django-subforms"
"Bug Tracker" = "https://github.com/MrThearMan/django-subforms/issues"
"Documentation" = "https://mrthearman.github.io/django-subforms"

[dependency-groups]
# Development installs the library itself, so that "uv run" needs no extra flags.
dev = [
    "django-subforms",
]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "coverage==7.16.2",
    "beautifulsoup4==4.15.0",
    "nox==2026.8.17",
]
docs = [
    "mkdocs==1.6.1",
    "pymdown-extensions==12.1",
    "mkdocs-mermaid2-plugin==1.2.3",
]
lint = [
    "prek==0.5.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "django-stubs==6.1.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
django-subforms = { workspace = true }

[tool.uv.build-backend]
# The package is at the repository root, not under "src".
module-root = ""
module-name = [
    "subforms",
]

[tool.coverage.run]
relative_files = true
branch = true
include = [
    "subforms/*",
    "tests/*",  # Make sure all tests are actually run
]
omit = [
    "undine/__main__.py",
]

[tool.coverage.report]
omit = [
    "tests*",
    "docs*",
    ".venv*",
    ".tox*",
]
exclude_lines = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    "pragma: no cover",
    "pass",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.project.settings"
addopts = "--disable-warnings"

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
